[project]
name = "YTSync"
dynamic = ["version", "dependencies"]
description = "YouTube sync"
readme = "README.md"
authors = [{ name = "Vignesh Rao", email = "svignesh1793@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"

[tool.setuptools]
packages = [
    "yt2jf"
]

[tool.setuptools.dynamic]
version = {attr = "yt2jf.version.__version__"}
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
dev = ["pre-commit"]

[build-system]
requires      = ["setuptools==76.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/thevickypedia/YTSync"
Source = "https://github.com/thevickypedia/YTSync"
"Bug Tracker" = "https://github.com/thevickypedia/YTSync/issues"
